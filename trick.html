<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한 방에 · 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --sky:#BFE6FF; --ink:#1D2340; --ink-soft:#4A5378; --panel:#FFFFFF; --panel-ink:#1D2340;
  --accent:#FF4B6E; --sun:#FFC93C; --line:#1D2340; --muted:#E9EDF8;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:#0E1433; --ink:#F2F4FF; --ink-soft:#B7BEE3; --panel:#1E2448; --panel-ink:#F2F4FF;
    --accent:#FF6A86; --line:#05081A; --muted:#2B3262; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sky:#0E1433; --ink:#F2F4FF; --ink-soft:#B7BEE3; --panel:#1E2448; --panel-ink:#F2F4FF;
  --accent:#FF6A86; --line:#05081A; --muted:#2B3262; color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;background:var(--sky);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:var(--sky);color:var(--ink);
  font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0;
  text-align:center;pointer-events:none;transition:opacity .25s}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:560px;margin:0 auto}
.bar .grp{display:flex;gap:8px;align-items:center}
.chip{pointer-events:auto;background:var(--panel);color:var(--panel-ink);border:2.5px solid var(--line);
  border-radius:999px;padding:7px 13px;font-weight:900;font-size:14px;line-height:1;box-shadow:0 3px 0 var(--line)}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.icon{width:36px;height:36px;padding:0;display:grid;place-items:center;font-size:17px}
.tries{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-size:20px;letter-spacing:.01em;color:var(--ink)}
.hook{font-family:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;font-weight:400;
  font-size:clamp(34px,10.5vw,60px);line-height:1.05;margin:12px 0 4px;color:#fff;display:inline-block;
  transform:rotate(-2.5deg);
  text-shadow:
    3px 0 0 #1D2340,-3px 0 0 #1D2340,0 3px 0 #1D2340,0 -3px 0 #1D2340,
    2px 2px 0 #1D2340,-2px -2px 0 #1D2340,2px -2px 0 #1D2340,-2px 2px 0 #1D2340,
    0 7px 0 #1D2340}
.hook.pop{animation:pop .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{transform:rotate(-12deg) scale(.4);opacity:0}100%{transform:rotate(-2.5deg) scale(1);opacity:1}}
.sub{margin:6px auto 0;font-weight:700;font-size:15px;color:var(--ink-soft);max-width:36ch}

.pill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
  background:var(--panel);color:var(--panel-ink);border:2.5px solid var(--line);border-radius:999px;
  padding:9px 16px;font-weight:900;font-size:14px;white-space:nowrap;box-shadow:0 3px 0 var(--line);
  pointer-events:none;transition:opacity .2s}
.pill.hot{background:var(--accent);color:#fff}
.pill.used{background:var(--muted);color:var(--ink-soft)}
.hidden{opacity:0 !important;pointer-events:none !important}
.gone{display:none !important}

.toast{position:fixed;left:0;right:0;top:44%;text-align:center;pointer-events:none;
  font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-size:clamp(36px,11vw,64px);color:#fff;
  text-shadow:3px 0 0 #1D2340,-3px 0 0 #1D2340,0 3px 0 #1D2340,0 -3px 0 #1D2340,2px 2px 0 #1D2340,-2px -2px 0 #1D2340,2px -2px 0 #1D2340,-2px 2px 0 #1D2340,0 7px 0 #1D2340;
  opacity:0}
.toast.show{animation:toast .9s ease-out both}
@keyframes toast{0%{opacity:0;transform:scale(.5) rotate(4deg)}18%{opacity:1;transform:scale(1.08) rotate(-2deg)}30%{transform:scale(1) rotate(-2deg)}80%{opacity:1}100%{opacity:0;transform:scale(1) rotate(-2deg) translateY(-12px)}}

.sheet{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;
  padding:0 12px calc(env(safe-area-inset-bottom,0px) + 12px);pointer-events:none}
.card{pointer-events:auto;width:100%;max-width:440px;background:var(--panel);color:var(--panel-ink);
  border:3px solid var(--line);border-radius:24px;padding:20px 18px 16px;box-shadow:0 6px 0 var(--line);
  animation:rise .35s cubic-bezier(.2,1.3,.4,1) both}
@keyframes rise{0%{transform:translateY(40px);opacity:0}100%{transform:none;opacity:1}}
.card h2{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400;font-size:40px;line-height:1.05;margin:0 0 8px;letter-spacing:-.01em}
.card p{margin:0 0 12px;font-size:15px;line-height:1.55;color:var(--ink-soft);font-weight:500}
.code{display:flex;align-items:baseline;gap:8px;font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:14px}
.code b{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400;font-size:22px;color:var(--panel-ink);letter-spacing:.04em}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:2.5px solid var(--line);border-radius:16px;padding:13px 10px;font-weight:900;font-size:16px;
  background:var(--muted);color:var(--panel-ink);box-shadow:0 3px 0 var(--line)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.primary{grid-column:1 / -1;background:var(--accent);color:#fff}

.maps h2{font-size:30px}
.maplist{display:grid;gap:8px;margin:4px 0 14px}
.mapitem{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;
  border:2.5px solid var(--line);border-radius:14px;padding:11px 13px;background:var(--muted);font-weight:900;font-size:15px}
.mapitem small{font-weight:700;font-size:12px;color:var(--ink-soft);white-space:nowrap}
.mapitem.on{background:var(--sun);color:#1D2340}
.mapitem.on small{color:#1D2340}
.note{font-size:12px !important;margin:0 !important}

.lb{position:fixed;left:0;right:0;height:max(56px,9vh);background:#05081A;color:#fff;display:flex;align-items:center;
  justify-content:center;gap:12px;font-weight:900;font-size:15px;pointer-events:none;transition:transform .35s ease}
.lb.t{top:0;padding-top:env(safe-area-inset-top,0px);height:calc(max(56px,9vh) + env(safe-area-inset-top,0px));transform:translateY(-110%)}
.lb.b{bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);height:calc(max(56px,9vh) + env(safe-area-inset-bottom,0px));transform:translateY(110%)}
.replaying .lb{transform:none}
.replaying .top{opacity:0}
.lb .rec{width:10px;height:10px;border-radius:50%;background:#FF4B6E}
.lb button{pointer-events:auto;background:transparent;border:2px solid #fff;color:#fff;border-radius:999px;padding:6px 14px;font-weight:900;font-size:14px}
@media (prefers-reduced-motion: reduce){
  .hook.pop,.toast.show,.card{animation-duration:.01s}
  .lb{transition:none}
}
</style>
</head>
<body>
<canvas id="c" aria-label="게임 화면: 당겨서 놓으면 발사"></canvas>

<header class="top" id="top">
  <div class="bar">
    <button class="chip" id="mapBtn" type="button">맵 1/5</button>
    <span class="tries" id="tries">시도 0</span>
    <div class="grp">
      <button class="chip icon" id="soundBtn" type="button" aria-label="소리 끄기">🔊</button>
      <button class="chip icon" id="resetBtn" type="button" aria-label="다시 놓기">↺</button>
    </div>
  </div>
  <h1 class="hook" id="hook">이거 한 방에 됨?</h1>
  <p class="sub" id="sub"></p>
</header>

<div class="pill" id="hint">당겨서 놓으면 발사</div>
<div class="pill hot hidden" id="fuel">날아가는 중 화면 탭하면 추진기</div>
<div class="toast" id="toast"></div>

<div class="lb t"><span class="rec"></span><span id="replayLabel">리플레이</span></div>
<div class="lb b"><button type="button" id="skipBtn">건너뛰기</button></div>

<div class="sheet gone" id="winSheet">
  <div class="card" role="dialog" aria-labelledby="winTitle">
    <h2 id="winTitle">한 방에!</h2>
    <p id="winSub"></p>
    <div class="code">샷 코드 <b id="code">#1</b></div>
    <div class="btns">
      <button class="btn primary" id="replayBtn" type="button">리플레이 보기</button>
      <button class="btn" id="againBtn" type="button">다시 쏘기</button>
      <button class="btn" id="nextBtn" type="button">다음 맵</button>
    </div>
  </div>
</div>

<div class="sheet maps gone" id="mapSheet">
  <div class="card" role="dialog" aria-labelledby="mapTitle">
    <h2 id="mapTitle">맵 고르기</h2>
    <div class="maplist" id="mapList"></div>
    <div class="btns"><button class="btn primary" id="closeMaps" type="button">닫기</button></div>
  </div>
</div>

<div id="probe" style="position:fixed;top:0;left:0;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)"></div>

<script>
/*SIM-START*/
const W = 900, H = 1400, GROUND = 1340, STEP = 1000 / 60, GSTEP = 0.001 * STEP * STEP;
const PAD = { x: 130, y: 1200 }, CAR_W = 76, CAR_H = 26, MAXPULL = 230, PULLK = 0.125, CAR_AIR = 0.004;

function mkS(M, x, y, w, h, kind, o) {
  const b = M.Bodies.rectangle(x, y, w, h, Object.assign({ isStatic: true, friction: 0.9 }, o || {}));
  b.kind = kind; b.w = w; b.h = h; return b;
}
function mkD(M, x, y, w, h, kind, o) {
  const b = M.Bodies.rectangle(x, y, w, h, Object.assign({ friction: 0.6, density: 0.002 }, o || {}));
  b.kind = kind; b.w = w; b.h = h; return b;
}

const LEVELS = [
  {
    title: '트럭 짐칸에 쏙',
    sub: '흰 전기 스포츠카를 트럭 짐칸에 세우기',
    build(M, L) {
      L.add(mkS(M, 680, 1314, 300, 24, 'chassis'));
      L.add(mkS(M, 660, 1292, 210, 20, 'truckbed'));
      L.add(mkS(M, 556, 1255, 14, 70, 'truckwall'));
      L.add(mkS(M, 818, 1235, 90, 130, 'cab'));
      L.deco.push({ type: 'wheels', xs: [585, 790], y: 1328 });
      return { type: 'rest', rect: { x: 565, y: 1215, w: 196, h: 67 } };
    }
  },
  {
    title: '도미노로 종 울리기',
    sub: '도미노를 쓰러뜨려 마지막 한 개가 종에 닿게',
    build(M, L) {
      for (let i = 0; i < 8; i++) L.add(mkD(M, 380 + i * 50, GROUND - 50, 14, 100, 'domino', { density: 0.003, friction: 0.5 }));
      L.deco.push({ type: 'bell', x: 832, y: 1190, postX: 888 });
      return { type: 'hit', by: 'domino', rect: { x: 755, y: 1215, w: 125, h: 125 } };
    }
  },
  {
    title: '웨딩 케이크 꼭대기 착지',
    sub: '맨 위 층에 차를 세우기, 샴페인 탑은 덤',
    build(M, L) {
      L.add(mkS(M, 450, 1300, 170, 80, 'table'));
      const gl = { density: 0.0006, friction: 0.5, restitution: 0.1 };
      [[410, 1240], [450, 1240], [490, 1240], [430, 1200], [470, 1200], [450, 1160]].forEach(p => L.add(mkD(M, p[0], p[1], 30, 40, 'glass', gl)));
      L.add(mkS(M, 700, 1300, 260, 80, 'cake'));
      L.add(mkS(M, 700, 1225, 190, 70, 'cake'));
      L.add(mkS(M, 700, 1160, 120, 60, 'cake'));
      return { type: 'rest', rect: { x: 642, y: 1068, w: 116, h: 62 } };
    }
  },
  {
    title: '탑 무너뜨려 별 떨구기',
    sub: '꼭대기 별이 바구니에 들어가게',
    build(M, L) {
      L.add(mkS(M, 640, 1280, 120, 120, 'solid'));
      let ci = 0;
      for (let r = 0; r < 3; r++) for (const x of [615, 665]) {
        const b = L.add(mkD(M, x, 1195 - r * 50, 50, 50, 'box', { density: 0.0015, friction: 0.6 }));
        b.ci = (ci++) % 4;
      }
      L.add(mkD(M, 640, 1062, 130, 16, 'plank', { density: 0.0015 }));
      const star = M.Bodies.circle(640, 1034, 20, { density: 0.001, friction: 0.4, restitution: 0.2 });
      star.kind = 'star'; star.w = 40; star.h = 40; L.add(star);
      L.add(mkS(M, 800, 1305, 10, 70, 'basket'));
      L.add(mkS(M, 895, 1295, 10, 90, 'basket'));
      return { type: 'hit', by: 'star', rect: { x: 805, y: 1250, w: 85, h: 90 } };
    }
  },
  {
    title: '천장 아래로 벽 넘기',
    sub: '천장에 닿지 않게 벽을 넘어 착지대에 세우기',
    build(M, L) {
      L.add(mkS(M, 560, 760, 720, 30, 'solid'));
      L.add(mkS(M, 480, 1210, 30, 260, 'solid'));
      L.add(mkS(M, 790, 1266, 16, 148, 'pole'));
      L.add(mkS(M, 790, 1180, 160, 24, 'pad'));
      return { type: 'rest', rect: { x: 712, y: 1110, w: 156, h: 58 } };
    }
  }
];

function buildSim(M, i) {
  const engine = M.Engine.create();
  engine.gravity.y = 1; engine.gravity.scale = 0.001;
  const bodies = [];
  const L = { deco: [], add(b) { M.Composite.add(engine.world, b); bodies.push(b); return b; } };
  L.add(mkS(M, W / 2, GROUND + 30, W * 3, 60, 'ground'));
  L.add(mkS(M, PAD.x, PAD.y + 70, 120, 140, 'pedestal'));
  const goal = LEVELS[i].build(M, L);
  const car = M.Bodies.rectangle(PAD.x, PAD.y - CAR_H / 2 - 0.5, CAR_W, CAR_H, {
    chamfer: { radius: 9 }, density: 0.004, friction: 0.6, restitution: 0.12, frictionAir: CAR_AIR
  });
  car.kind = 'car'; car.w = CAR_W; car.h = CAR_H; L.add(car);
  return { M, engine, bodies, deco: L.deco, goal, car, level: i, steps: 0, rest: 0, still: 0, minDist: 1e9,
    result: null, resultStep: 0, carGone: false, thrustUsed: false, flame: 0, shot: null, replay: false };
}

function launchSim(s, vx, vy) {
  s.shot = { vx, vy, thrustStep: -1 };
  s.M.Body.setVelocity(s.car, { x: vx, y: vy });
  s.M.Body.setAngularVelocity(s.car, 0);
}

function thrustSim(s) {
  const c = s.car, v = c.velocity, sp = Math.hypot(v.x, v.y), dx = sp > 0.5 ? v.x / sp : 1;
  s.M.Body.setVelocity(c, { x: v.x * 0.75 + dx * 6, y: -10.5 });
  s.M.Body.setAngularVelocity(c, c.angularVelocity * 0.3);
  s.thrustUsed = true; s.flame = 24;
  if (s.shot) s.shot.thrustStep = s.steps;
}

function inRect(p, r) { return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }
function distRect(p, r) {
  const dx = Math.max(r.x - p.x, 0, p.x - (r.x + r.w)), dy = Math.max(r.y - p.y, 0, p.y - (r.y + r.h));
  return Math.hypot(dx, dy);
}
function tracked(s) {
  if (s.goal.type === 'rest') return s.carGone ? [] : [s.car];
  return s.bodies.filter(b => b.kind === s.goal.by);
}

function evalSim(s) {
  const g = s.goal, tr = tracked(s), c = s.car;
  for (const b of tr) { const d = distRect(b.position, g.rect); if (d < s.minDist) s.minDist = d; }
  if (g.type === 'rest') {
    if (inRect(c.position, g.rect) && c.speed < 0.7 && c.angularSpeed < 0.05) s.rest++; else s.rest = 0;
    if (s.rest >= 20) return 'win';
  } else {
    for (const b of tr) if (inRect(b.position, g.rect)) return 'win';
  }
  if (!s.carGone && (c.position.x < -250 || c.position.x > W + 250 || c.position.y > H + 150)) {
    if (g.type === 'rest') return 'lose';
    s.M.Composite.remove(s.engine.world, c); s.carGone = true;
  }
  if (s.steps > 60) {
    let mv = false;
    for (const b of s.bodies) {
      if (b.isStatic || (b === c && s.carGone)) continue;
      if (b.speed > 0.15 || b.angularSpeed > 0.01) { mv = true; break; }
    }
    s.still = mv ? 0 : s.still + 1;
    if (s.still > 40) return 'lose';
  }
  if (s.steps > 840) return 'lose';
  return null;
}

function stepSim(s) {
  if (s.replay && s.shot && s.shot.thrustStep === s.steps && !s.thrustUsed) thrustSim(s);
  s.M.Engine.update(s.engine, STEP);
  s.steps++;
  if (s.flame > 0) s.flame--;
  if (!s.result) { const r = evalSim(s); if (r) { s.result = r; s.resultStep = s.steps; } }
}
/*SIM-END*/
(function(){
'use strict';
const M = window.Matter;
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)');
const darkMQ = matchMedia('(prefers-color-scheme: dark)');
const isDark = () => { const t = document.documentElement.dataset.theme; return t === 'dark' || (t !== 'light' && darkMQ.matches); };

const INK = '#1D2340';
const CAMX = 480;
const STARS = (() => { let seed = 7; const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647; const a = []; for (let i = 0; i < 46; i++) a.push([r() * 1500 - 300, 80 + r() * 1000, 1.5 + r() * 2.5]); return a; })();
const BOX = ['#FF4B6E', '#FFC93C', '#4FA8FF', '#8C6CFF'];
const PAL = {
  light: { skyTop: '#BFE6FF', skyBot: '#FFF3D1', grass: '#55B866', grassDark: '#3F9A52', dirt: '#B9774A', dirt2: '#A3653C',
    solid: '#2E3A66', cloud: 'rgba(255,255,255,.9)', goal: '#FF4B6E', glass: 'rgba(170,220,255,.6)', glassLine: '#2D5E93',
    domino: '#1D2340', pip: '#FFFFFF', table: '#EDE7FF', wood: '#C98B4F', basket: '#A7652F', traj: '#1D2340', star: false },
  dark: { skyTop: '#0E1433', skyBot: '#2C2452', grass: '#2F8A55', grassDark: '#236B42', dirt: '#5A3A2A', dirt2: '#4A2F22',
    solid: '#8C99D6', cloud: 'rgba(255,255,255,.07)', goal: '#FF6A86', glass: 'rgba(170,220,255,.4)', glassLine: '#CFE6FF',
    domino: '#E9ECFF', pip: '#1D2340', table: '#3A3F70', wood: '#B07A45', basket: '#9A5E2C', traj: '#FFFFFF', star: true }
};

// ---------- state ----------
let dpr = 1, cw = 0, ch = 0, safeBot = 0, topRes = 150, groundY = 0, baseK = 0.4;
let sim = null, mode = 'aim', level = 0, attempts = 0, aim = null, ts = 1, shake = 0, shakeX = 0, shakeY = 0;
let cam = { x: CAMX, y: GROUND, z: 1 }, parts = [], token = 0, bell = { a: 0, v: 0 }, lastThud = 0;
let lastShot = null, lastAttempts = 0, soundOn = true, firstLevelShown = -1;
let best = {};
try { best = JSON.parse(localStorage.getItem('hanbang-proto-best') || '{}') || {}; } catch (e) { best = {}; }
const saveBest = () => { try { localStorage.setItem('hanbang-proto-best', JSON.stringify(best)); } catch (e) {} };

// ---------- sound ----------
const sfx = {
  a: null,
  init() { if (this.a) return; try { this.a = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.a = null; } },
  tone(f1, f2, dur, type, vol, delay) {
    const a = this.a; if (!a || !soundOn) return;
    try {
      const t = a.currentTime + (delay || 0), o = a.createOscillator(), g = a.createGain();
      o.type = type; o.frequency.setValueAtTime(f1, t);

  }
  if (r === 'win') {

    if (!best[level] || attempts < best[level]) { best[level] = attempts; saveBest(); }

    setTimeout(() => { if (t === token) startLevel(level, true); }, near ? 950 : 750);

  ctx.restore();
  if (sim.result === 'win') return;
  const gc = goalCenter(g), y = r.y - 30 + Math.sin(now / 200) * 7;
  ctx.save(); ctx.translate(gc.x, y); ctx.fillStyle = P.goal; ctx.strokeStyle = INK; ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.moveTo(-15, -12); ctx.lineTo(15, -12); ctx.lineTo(0, 8); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
}

function drawDeco(P, front) {
  for (const d of sim.deco) {
    if (d.type === 'wheels' && front) {
      for (const x of d.xs) { ctx.fillStyle = INK; circ(x, d.y, 19); ctx.fillStyle = '#9AA3C7'; circ(x, d.y, 8); }
    }
    if (d.type === 'bell' && !front) {
      ctx.lineWidth = 4; ctx.strokeStyle = INK;
      rr(d.postX - 9, 1110, 18, GROUND - 1110, 6); ctx.fillStyle = P.solid; ctx.fill(); ctx.stroke();
      rr(d.x - 6, 1104, d.postX - d.x + 15, 16, 6); ctx.fill(); ctx.stroke();
      ctx.save(); ctx.translate(d.x, 1120); ctx.rotate(bell.a);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 22); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-26, 76); ctx.quadraticCurveTo(-26, 22, 0, 22); ctx.quadraticCurveTo(26, 22, 26, 76); ctx.lineTo(32, 84); ctx.lineTo(-32, 84); ctx.closePath();
      ctx.fillStyle = '#FFC93C'; ctx.fill(); ctx.stroke();
      ctx.fillStyle = INK; circ(0, 88, 7);
      ctx.restore();
    }
  }
}

function drawAim(P) {
  const c = sim.car.position, k = baseK * cam.z;
  let px = (aim.sx - aim.cx) / k, py = (aim.sy - aim.cy) / k, len = Math.hypot(px, py);
  if (len < 4) return;
  if (len > MAXPULL) { px *= MAXPULL / len; py *= MAXPULL / len; len = MAXPULL; }
  // band
  const hx = c.x - px * 0.45, hy = c.y - py * 0.45;
  ctx.lineCap = 'round'; ctx.strokeStyle = INK; ctx.lineWidth = 12; ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(hx, hy); ctx.stroke();
  ctx.strokeStyle = '#FF4B6E'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(hx, hy); ctx.stroke();
  ctx.fillStyle = '#FFFFFF'; ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(hx, hy, 14, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  // partial trajectory
  let x = c.x, y = c.y, vx = px * PULLK, vy = py * PULLK; const fa = 1 - CAR_AIR;
  ctx.fillStyle = P.traj;
  for (let s = 1; s <= 54; s++) {
    vx *= fa; vy = vy * fa + GSTEP; x += vx; y += vy;
    if (s % 4 === 0) { const t = s / 54; ctx.globalAlpha = 0.9 - t * 0.78; circ(x, y, 7 - t * 3.5); }
  }
  ctx.globalAlpha = 1;
  // power
  const pct = Math.round(len / MAXPULL * 100);
  ctx.font = '700 26px "Noto Sans KR", system-ui, sans-serif'; ctx.textAlign = 'center';
  ctx.lineWidth = 6; ctx.strokeStyle = INK; ctx.strokeText(pct + '%', hx, hy - 26);
  ctx.fillStyle = '#FFFFFF'; ctx.fillText(pct + '%', hx, hy - 26);
}

function draw(now) {
  if (!sim) return;
  const P = isDark() ? PAL.dark : PAL.light;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const sg = ctx.createLinearGradient(0, 0, 0, ch);
  sg.addColorStop(0, P.skyTop); sg.addColorStop(1, P.skyBot);
  ctx.fillStyle = sg; ctx.fillRect(0, 0, cw, ch);

  const k = baseK * cam.z;
  const ox = cw / 2 - cam.x * k + shakeX, oy = groundY - cam.y * k + shakeY;
  ctx.setTransform(dpr * k, 0, 0, dpr * k, dpr * ox, dpr * oy);

  // sky deco
  if (P.star) {
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    for (const st of STARS) circ(st[0], st[1], st[2]);
  } else {
    ctx.fillStyle = P.cloud;
    const drift = (now / 120) % 1400;
    for (const [cx0, cy, s] of [[100, 520, 1], [620, 380, 1.3], [1040, 600, 0.9]]) {
      const cx = ((cx0 + drift) % 1600) - 300;
      circ(cx, cy, 34 * s); circ(cx + 40 * s, cy - 14 * s, 42 * s); circ(cx + 86 * s, cy, 32 * s); ctx.fillRect(cx, cy, 86 * s, 30 * s);
    }
  }
  // ground
  ctx.fillStyle = P.dirt; ctx.fillRect(-3000, GROUND, 7000, 2000);
  ctx.fillStyle = P.dirt2; for (let x = -3000; x < 4000; x += 70) ctx.fillRect(x, GROUND + 34 + (x % 140 ? 0 : 20), 26, 8);
  ctx.fillStyle = P.grass; ctx.fillRect(-3000, GROUND - 2, 7000, 18);
  ctx.fillStyle = P.grassDark; ctx.fillRect(-3000, GROUND + 14, 7000, 5);

  drawDeco(P, false);
  drawGoal(P, now);
  for (const b of sim.bodies) if (b.isStatic) drawBody(b, P);
  for (const b of sim.bodies) if (!b.isStatic && b !== sim.car) drawBody(b, P);
  drawDeco(P, true);
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.max * 1.4));
    ctx.fillStyle = p.c;
    if (p.k === 'conf') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore(); }
    else circ(p.x, p.y, p.size * (0.5 + 0.5 * p.life / p.max));
  }
  ctx.globalAlpha = 1;
  drawBody(sim.car, P);
  if (mode === 'aim' && aim) drawAim(P);
}

// ---------- boot ----------
function boot() {
  layout();
  startLevel(0, false);
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
}
if (!M) {
  document.body.insertAdjacentHTML('beforeend', '<p style="position:fixed;inset:auto 0 40% 0;text-align:center;font-weight:900">물리 엔진을 불러오지 못했어요. 새로고침해 주세요.</p>');
} else boot();
})();

</script>
</body>
